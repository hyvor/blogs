services:
  postgres:
    image: postgres:16
    container_name: hyvor-blogs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?postgres password not set}
      POSTGRES_DB: hyvor_blogs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hyvor_blogs"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  blogs:
    # note: latest is replaced with the actual version tag in zip.sh when building the image
    image: hyvor/blogs:latest
    container_name: hyvor-blogs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - blog_media:/app/media
      # Uncomment if TLS_MODE=manual, and point TLS_CERT_FILE/TLS_KEY_FILE in .env to paths under /certs
      # - /path/to/your/certs:/certs:ro

volumes:
  postgres_data:
  blog_media:
