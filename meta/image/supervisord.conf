[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:frankenphp]
command=php /app/backend/artisan octane:frankenphp --port=8080 --caddyfile=/etc/caddy/Caddyfile
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
autorestart=true
startretries=0

[program:worker]
process_name=%(program_name)s_%(process_num)02d
command=php /app/backend/artisan queue:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=~/worker.log
stopwaitsecs=60

[program:worker-reports]
process_name=%(program_name)s_%(process_num)02d
command=php /app/backend/artisan queue:work --queue=reports --timeout=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=~/worker-reports.log
stopwaitsecs=3600

[program:scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while [ true ]; do (php /app/backend/artisan schedule:run --verbose --no-interaction &); sleep 60; done"
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=~/scheduler.log
stopwaitsecs=60
user=www-data
