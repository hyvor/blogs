version: '3.3'
services:
  mysql:
    # mysql 8.0
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ROOT_HOST: "%"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_DATABASE: hyvor_blogs_testing
    ports:
      - "3306:3306"
    expose:
      -   3306
    volumes:
      - ~/mysql:/var/lib/mysql:delegated
      - ./docker/mysql-init:/docker-entrypoint-initdb.d

  meilisearch:
    image: getmeili/meilisearch:v1.0
    restart: unless-stopped
    ports:
      - '7700:7700'

volumes:
  mysql:
  redis: