version: "3.3"
services:
    hb-mysql:
        image: "mysql:latest"
        environment:
            MYSQL_USER: "mysql"
            MYSQL_PASSWORD: "mysql"
            MYSQL_DATABASE: "hyvor-blogs"
        expose:
            - "3306"
        volumes:
            - mysql:/var/lib/mysql

    hb-meilisearch:
        image: "meilisearch/meilisearch:latest"
        expose:
            - "7700"
        volumes:
            - meilisearch-data:/data.ms
        environment:
            MEILI_MASTER_KEY: "MASTER_KEY"

    hb-app:
        image: "hyvor/hyvor-blogs:latest"
        ports:
            - "127.0.0.1:5000:5000"
        env_file:
            - .env
        depends_on:
            - hb-mysql
            - hb-meilisearch

volumes:
    mysql:
    meilisearch-data:
