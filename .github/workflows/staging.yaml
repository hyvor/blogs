
name: "Deploy to Staging"

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to deploy"
                required: false
                default: "latest"

jobs:
    deploy:
        name: "Deploying ${{ github.event.inputs.tag }}"
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Upload docker-compose.yaml and .env
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.HYVOR_ORG_STAGING_SERVER_IP }}
                  username: root
                  key: ${{ secrets.HYVOR_ORG_STAGING_SSH_KEY }}
                  source: "docker/cloud/staging/docker-compose.staging.yaml,docker/cloud/staging/.env.staging"
                  target: /root
                  overwrite: true
                  strip_components: 3

            - name: Deploy to Cloud
              uses: appleboy/ssh-action@master
              env:
                  IMAGE_VERSION: ${{ github.event.inputs.tag }}
                  DOCKERHUB_USERNAME: ${{ secrets.HYVOR_ORG_DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.HYVOR_ORG_DOCKERHUB_TOKEN }}
                  ONE_PASSWORD_TOKEN: ${{ secrets.HYVOR_ORG_STAGING_ONE_PASSWORD_SERVICE_ACCOUNT_TOKEN }}
              with:
                  host: ${{ secrets.HYVOR_ORG_STAGING_SERVER_IP }}
                  username: root
                  key: ${{ secrets.HYVOR_ORG_STAGING_SSH_KEY }}
                  envs: IMAGE_VERSION, DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, ONE_PASSWORD_TOKEN, ENV_FILE
                  script: |
                      set -e

                      # docker
                      echo $DOCKERHUB_TOKEN | docker login -u $DOCKERHUB_USERNAME --password-stdin

                      # 1password
                      export OP_SERVICE_ACCOUNT_TOKEN=$ONE_PASSWORD_TOKEN
                      op user get --me
                      op inject --force --in-file .env.staging --out-file .env

                      # docker-compose
                      cp docker-compose.staging.yaml docker-compose.yaml
                      # fresh pull
                      docker pull $DOCKERHUB_USERNAME/hyvor-blogs:$IMAGE_VERSION
                      # fresh up
                      docker compose down
                      docker compose up -d
