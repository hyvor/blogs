name: Translate Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/routes/(marketing)/\[\[lang\]\]/locale/en.json'
      - 'frontend/src/routes/(marketing)/\[\[lang\]\]/docs/\[\[slug\]\]/en/**'
  workflow_dispatch:
    inputs:
      langs:
        description: 'Comma-separated language codes to translate (default: all configured languages)'
        required: false
        type: string
      force_all:
        description: 'Force re-translate all files, ignoring the cache'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    name: 'Frontend / Translate'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # .translate-cache.json is committed to the repo, so the checkout
      # above already has the latest cache state - no actions/cache step
      # is needed here.

      - name: Run translation
        id: translate
        working-directory: frontend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: |
          ARGS=()
          if [ -n "${{ inputs.langs }}" ]; then
            ARGS+=(--langs "${{ inputs.langs }}")
          fi
          if [ "${{ inputs.force_all }}" = "true" ]; then
            ARGS+=(--force-all)
          fi
          npm run translate -- "${ARGS[@]}"

      - name: Open PR with translated content
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update translations'
          title: 'Update translations'
          body: |
            Auto-generated by the Translate Frontend workflow.
            Source change: ${{ github.sha }}
          branch: auto/translate
          # No add-paths: the translation script only ever touches the
          # per-language output files and the cache, so staging all
          # changes (the action's default) is both correct and simpler
          # than glob-escaping the SvelteKit `[[lang]]`/`[[slug]]` folders.

      - name: Fail if any file failed to translate
        if: steps.translate.outcome == 'failure'
        run: exit 1
