name: Test

on:
    push:
        branches: [ master ]
    pull_request:
    workflow_dispatch:

jobs:
    tests:
        name: "Tests"
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v3

            -   name: Setup Node
                uses: actions/setup-node@v3
                with:
                    node-version: 16

            -   name: Set up services
                run: |
                    docker-compose up -d

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    php-version: "8.2"
                    ini-file: development
                    tools: composer:v2
                    extensions: mbstring, ctype, fileinfo, openssl, PDO, bcmath, json, tokenizer, xml, intl

            -   name: Install dependencies
                env:
                    REPMAN_TOKEN: ${{ secrets.REPMAN_TOKEN }}
                run: |
                    npm ci --ignore-scripts
                    npm run build
                    composer config --global --auth http-basic.hyvor.repo.repman.io token ${REPMAN_TOKEN}
                    composer install --ansi --no-progress

            -   name: Run tests
                run: vendor/bin/pest

    e2e:
        name: "E2E Tests"
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v3

            -   name: Set up services
                run: |
                    docker-compose up -d

            -   name: Setup Node
                uses: actions/setup-node@v3
                with:
                    node-version: 16

            -   name: Cache dependencies
                uses: actions/cache@v3
                with:
                    path: ~/.npm
                    key: npm-${{ hashFiles('package-lock.json') }}
                    restore-keys: npm-

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    php-version: "8.1"
                    ini-file: development
                    tools: composer:v2
                    extensions: mbstring, ctype, fileinfo, openssl, PDO, bcmath, json, tokenizer, xml, intl

            -   name: Install dependencies
                env:
                    REPMAN_TOKEN: ${{ secrets.REPMAN_TOKEN }}
                run: |
                    composer config --global --auth http-basic.hyvor.repo.repman.io token ${REPMAN_TOKEN}
                    composer install
                    npm ci --ignore-scripts
                    npm run build

            -   name: Run PHP Server
                env:
                    APP_ENV: testing
                    APP_DEBUG: true
                    APP_KEY: "base64:XOpWztMz2EsJT/TF7QzscDfgUUCO3a+A6c9oP37l4UI="
                run: |
                    php artisan config:cache
                    php artisan serve --port=8080 &

            -   name: Run Migrations
                run: |
                    php artisan migrate

            -   name: Run e2e tests
                run: |
                    npx playwright install --with-deps
                    npx playwright test
            -   uses: actions/upload-artifact@v3
                if: always()
                with:
                    name: playwright-report
                    path: playwright-report/
                    retention-days: 30
    unit:
        name: JS Unit Tests
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v3

            -   name: Set up services
                run: |
                    docker-compose up -d

            -   name: Setup Node
                uses: actions/setup-node@v3
                with:
                    node-version: 16

            -   name: Cache dependencies
                uses: actions/cache@v3
                with:
                    path: ~/.npm
                    key: npm-${{ hashFiles('package-lock.json') }}
                    restore-keys: npm-

            -   name: Install dependencies
                env:
                    REPMAN_TOKEN: ${{ secrets.REPMAN_TOKEN }}
                run: |
                    npm install
                    npm ci --ignore-scripts
                    npm run build
            
            -   name: Run unit tests
                run:
                    npx vitest
    ts:
        name: TypeScript Validation
        runs-on: ubuntu-22.04

        steps:
            -   name: Checkout
                uses: actions/checkout@v3

            -   name: Editor
                run: npm ci && npm run kea:build && tsc --noEmit