name: Deploy

on:
    workflow_dispatch:

jobs:
    docker:
        name: "Building docker image ${{ github.sha }}"
        runs-on: ubuntu-latest
        steps:

            -   uses: actions/checkout@v2

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v1

            -   name: Cache Docker layers
                uses: actions/cache@v2
                with:
                    path: /tmp/.buildx-cache
                    key: ${{ runner.os }}-buildx-${{ github.sha }}
                    restore-keys: |
                        ${{ runner.os }}-buildx-

            -   name: Login to DockerHub
                uses: docker/login-action@v1
                with:
                    username: ${{ secrets.HYVOR_ORG_DOCKERHUB_USERNAME }}
                    password: ${{ secrets.HYVOR_ORG_DOCKERHUB_TOKEN }}

            -   name: Build and push
                uses: docker/build-push-action@v4
                with:
                    context: .
                    push: true
                    tags: |
                        ${{ secrets.HYVOR_ORG_DOCKERHUB_USERNAME }}/blogs:${{ github.sha }}
                        ${{ secrets.HYVOR_ORG_DOCKERHUB_USERNAME }}/blogs:latest
                    cache-from: type=local,src=/tmp/.buildx-cache
                    cache-to: type=local,dest=/tmp/.buildx-cache-new
                    file: ./docker/image/Dockerfile

            # This ugly bit is necessary if you don't want your cache to grow forever
            # until it hits GitHub's limit of 5GB.
            # Temp fix
            # https://github.com/docker/build-push-action/issues/252
            # https://github.com/moby/buildkit/issues/1896
            -   name: Move cache
                run: |
                    rm -rf /tmp/.buildx-cache
                    mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    deploy:
        name: "Deploying ${{ github.sha }}"
        needs: docker
        runs-on: ubuntu-latest
        strategy:
            matrix:
                server:
                    - name: hyvor-blogs-server-new
                      ip: 49.13.172.95

        steps:
            - uses: actions/checkout@v3

            -   name: Upload docker-compose.yaml
                uses: appleboy/scp-action@master
                with:
                    host: ${{ matrix.server.ip }}
                    username: root
                    key: ${{ secrets.DEPLOY_SSH_KEY }}
                    source: "docker/deployment/docker-compose.yaml"
                    target: /root

            -   name: Deploy to Cloud
                uses: appleboy/ssh-action@master
                env:
                    IMAGE_VERSION: ${{ github.sha }}
                    DOCKERHUB_USERNAME: ${{ secrets.HYVOR_ORG_DOCKERHUB_USERNAME }}
                    DOCKERHUB_TOKEN: ${{ secrets.HYVOR_ORG_DOCKERHUB_TOKEN }}
                    ENV_FILE: ${{ secrets.LARAVEL_ENV }}
                with:
                    host: ${{ matrix.server.ip }}
                    username: root
                    key: ${{ secrets.SSH_KEY }}
                    envs: IMAGE_VERSION, DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, ENV_FILE
                    script: |
                        docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN
                        printf "%s" "$ENV_FILE" > .env
                        docker rollout hyvor-blogs