name: Deploy to Production

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to deploy'
                required: false
                default: ''

jobs:
    tag:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            - name: Get latest tag
              id: get_tag
              # input tag or latest tag
              run: echo ::set-output name=tag::${{ github.event.inputs.tag || $(git describe --tags --abbrev=0) }}

    deploy:
        name: "Deploying ${{ needs.tag.outputs.tag }}"
        needs: tag
