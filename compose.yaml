services:
  frontend:
    container_name: hyvor-blogs-frontend
    build:
      context: .
      target: frontend-dev
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/static:/app/frontend/static
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./frontend/package.json:/app/frontend/package.json
      - ./frontend/package-lock.json:/app/frontend/package-lock.json
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json
      - ./frontend/svelte.config.js:/app/frontend/svelte.config.js
    labels:
      traefik.enable: true
      traefik.http.routers.hyvor-blogs-frontend.rule: Host(`blogs.hyvor.localhost`)
      traefik.http.routers.hyvor-blogs-frontend.entrypoints: https
      traefik.http.routers.hyvor-blogs-frontend.tls: true
      traefik.http.routers.hyvor-blogs-frontend.middlewares: vite-retry@file
      traefik.http.services.hyvor-blogs-frontend.loadbalancer.server.port: 36201

    networks:
      - hyvor-network

    profiles: [dev]

  backend:
    container_name: hyvor-blogs-backend
    build:
      context: .
      target: backend-dev
    volumes:
      - ./backend:/app/backend
      - ./symfony:/app/symfony
      # - ../internal:/app/backend/vendor/hyvor/internal:ro
      # - ../internal:/app/symfony/vendor/hyvor/internal:ro
    labels:
      traefik.enable: true
      # backend
      traefik.http.routers.hyvor-blogs-backend.rule: Host(`blogs.hyvor.localhost`) && (PathPrefix(`/api`) || PathPrefix(`/blog/`))
      traefik.http.routers.hyvor-blogs-backend.entrypoints: https
      traefik.http.routers.hyvor-blogs-backend.tls: true
      traefik.http.routers.hyvor-blogs-backend.service: hyvor-blogs-backend

      # subdirectory hosting
      traefik.http.routers.hyvor-blogs-subdir.rule: HostRegexp(`^.+\.hyvorblogs\.localhost$`)
      traefik.http.routers.hyvor-blogs-subdir.entrypoints: http
      traefik.http.routers.hyvor-blogs-subdir.service: hyvor-blogs-backend

      # services
      traefik.http.services.hyvor-blogs-backend.loadbalancer.server.port: 80
    networks:
      hyvor-network:
        aliases:
          - blogs.hyvor.internal
    profiles: [dev]
    healthcheck:
      disable: true
      test: ls

networks:
  hyvor-network:
    external: true
