services:
  frontend:
    container_name: hyvor-blogs-frontend
    build:
      context: .
      target: frontend-dev
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/static:/app/frontend/static
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./frontend/package.json:/app/frontend/package.json
      - ./frontend/package-lock.json:/app/frontend/package-lock.json
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json
      - ./frontend/svelte.config.js:/app/frontend/svelte.config.js
    labels:
      traefik.enable: true
      traefik.http.routers.hyvor-blogs-frontend.rule: Host(`blogs.hyvor.localhost`)
      traefik.http.routers.hyvor-blogs-frontend.entrypoints: https
      traefik.http.routers.hyvor-blogs-frontend.tls: true
      traefik.http.routers.hyvor-blogs-frontend.middlewares: vite-retry@file
      traefik.http.services.hyvor-blogs-frontend.loadbalancer.server.port: 36201

    networks:
      - hyvor-network

    profiles: [dev]

  backend:
    container_name: hyvor-blogs-backend
    build:
      context: .
      target: backend-dev
    volumes:
      - ./symfony:/app/backend
      - /app/backend/vendor
      #- ../internal:/app/backend/vendor/hyvor/internal:ro
    labels:
      traefik.enable: true
      # backend
      traefik.http.routers.hyvor-blogs-backend.rule: Host(`blogs.hyvor.localhost`) && (PathPrefix(`/api`) || PathPrefix(`/blog/`))
      traefik.http.routers.hyvor-blogs-backend.entrypoints: https
      traefik.http.routers.hyvor-blogs-backend.tls: true
      traefik.http.routers.hyvor-blogs-backend.service: hyvor-blogs-backend

      # subdirectory hosting
      traefik.http.routers.hyvor-blogs-subdir.rule: HostRegexp(`^.+\.hyvorblogs\.localhost$`)
      traefik.http.routers.hyvor-blogs-subdir.entrypoints: http
      traefik.http.routers.hyvor-blogs-subdir.service: hyvor-blogs-backend

      # let's encrypt
      traefik.http.routers.lets-encrypt.rule: Host(`custom-domain.localhost`) && PathPrefix(`/.well-known/acme-challenge`)
      traefik.http.routers.lets-encrypt.entrypoints: https
      traefik.http.routers.lets-encrypt.tls: true
      traefik.http.routers.lets-encrypt.service: hyvor-blogs-backend

      # custom domains (sent to container :443 without TLS termination)
      traefik.tcp.routers.hyvor-blogs-custom-domain.rule: HostSNIRegexp(`^.+\.custom-domain\.localhost$`)
      traefik.tcp.routers.hyvor-blogs-custom-domain.entrypoints: https
      traefik.tcp.routers.hyvor-blogs-custom-domain.tls.passthrough: true
      traefik.tcp.routers.hyvor-blogs-custom-domain.service: hyvor-blogs-backend
      traefik.tcp.services.hyvor-blogs-backend.loadbalancer.server.port: 443

      # services
      traefik.http.services.hyvor-blogs-backend.loadbalancer.server.port: 80
    networks:
      hyvor-network:
        aliases:
          - blogs.hyvor.internal
          - custom-domain.localhost
    profiles: [dev]
    healthcheck:
      disable: true
      test: ls

  pebble:
    container_name: hyvor-blogs-pebble
    image: ghcr.io/letsencrypt/pebble:latest
    command: -config /test/config/pebble-config.json
    ports:
      - 14000:14000 # ACME port
      - 15000:15000 # Management port
    volumes:
      - ./meta/dev/pebble.json:/test/config/pebble-config.json:ro
    environment:
      - PEBBLE_VA_NOSLEEP=1
    networks:
      hyvor-network:
        aliases:
          - blogs.pebble.localhost
    profiles: [external]

networks:
  hyvor-network:
    external: true
