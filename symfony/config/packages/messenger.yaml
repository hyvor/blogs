framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: "doctrine://default"
                retry_strategy:
                    # 1min base, ×5 each retry → ~1min, 5min, 25min (capped at 30min)
                    max_retries: 3
                    delay: 60000
                    multiplier: 5
                    max_delay: 1800000
            sync: "sync://"
            failed: "doctrine://default?queue_name=failed"

when@test:
    framework:
        messenger:
            transports:
                async: "test://"
                sync: "sync://"
                failed: "test://"
                scheduler_default: "test://"
