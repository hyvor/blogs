nelmio_cors:
    paths:
        # Data API
        "^/api/data/v0/":
            origin_regex: false
            allow_origin: ["*"]
            allow_methods: ["GET", "OPTIONS"]
            allow_headers: ["*"]
            max_age: 86400

        # Public API (needs access from core)
        "^/api/public/(themes|highlighting-docs)":
            origin_regex: false
            allow_origin: ["*"]
            allow_methods: ["GET", "OPTIONS"]
            allow_headers: ["*"]
            max_age: 86400
