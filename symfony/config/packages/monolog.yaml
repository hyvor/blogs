when@prod: &prod
    channels:
        - app
    monolog:
        handlers:
            app:
                type: stream
                path: "php://stderr"
                level: "%env(LOG_LEVEL)%"
                formatter: monolog.formatter.json
                channels: ["app"]

            non_app:
                type: stream
                path: "php://stderr"
                level: error
                formatter: monolog.formatter.json
                bubble: false
                channels: ["!app"]

when@dev: *prod

when@test:
    monolog:
        handlers:
            test:
                type: test
                level: debug
