when@prod: &prod
    monolog:
        handlers:
            main:
                type: stream
                path: "php://stderr"
                level: "%env(LOG_LEVEL)%"
                formatter: monolog.formatter.json
                channels: ["!cache"]

when@dev: *prod

when@test:
    monolog:
        handlers:
            test:
                type: test
                level: debug
