# /etc/php/8.1/fpm/pool.d/www.conf (remove this line)
[www]
user = www-data
group = www-data
listen = /run/php/php8.1-fpm.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 500
pm.start_servers = 60
pm.min_spare_servers = 60
pm.max_spare_servers = 100
request_terminate_timeout = 30
